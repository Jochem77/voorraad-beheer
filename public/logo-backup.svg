<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 768" width="768" height="768">
  <rect width="768" height="768" fill="#1e40af"/>
  <g fill="#fef08a" stroke="none">
    <!-- Top pins -->
    <rect x="172" y="0" width="40" height="120"/>
    <rect x="304" y="0" width="40" height="120"/>
    <rect x="424" y="0" width="40" height="120"/>
    <rect x="556" y="0" width="40" height="120"/>
    
    <!-- Bottom pins -->
    <rect x="172" y="648" width="40" height="120"/>
    <rect x="304" y="648" width="40" height="120"/>
    <rect x="424" y="648" width="40" height="120"/>
    <rect x="556" y="648" width="40" height="120"/>
    
    <!-- Left pins -->
    <rect x="0" y="172" width="120" height="40"/>
    <rect x="0" y="304" width="120" height="40"/>
    <rect x="0" y="424" width="120" height="40"/>
    <rect x="0" y="556" width="120" height="40"/>
    
    <!-- Right pins -->
    <rect x="648" y="172" width="120" height="40"/>
    <rect x="648" y="304" width="120" height="40"/>
    <rect x="648" y="424" width="120" height="40"/>
    <rect x="648" y="556" width="120" height="40"/>
    
    <!-- Chip outline -->
    <path d="M 150 150 L 150 618 L 618 618 L 618 150 Z M 200 200 L 200 568 L 568 568 L 568 200 Z" fill-rule="evenodd"/>
    
    <!-- Top row - circles -->
    <circle cx="264" cy="264" r="40"/>
    <circle cx="384" cy="264" r="40"/>
    <circle cx="504" cy="264" r="40"/>
    
    <!-- Middle row - rounded rectangles -->
    <rect x="224" y="364" width="80" height="40" rx="20"/>
    <rect x="344" y="364" width="80" height="40" rx="20"/>
    <rect x="464" y="364" width="80" height="40" rx="20"/>
    
    <!-- Bottom row - circles -->
    <circle cx="264" cy="504" r="40"/>
    <circle cx="384" cy="504" r="40"/>
    <circle cx="504" cy="504" r="40"/>
  </g>
</svg>
